<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBased</title>
    <link rel="icon" type="image/png" href="Resources/icon.png">
    <link rel="stylesheet" href="Resources/index.css">

    <script>
        // Pre-render theme check to prevent light-flash
        try {
            const saved = localStorage.getItem('cloudbased_session');
            const theme = saved ? (JSON.parse(saved).settings?.theme || 'light') : 'light';
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>

<body>
    <div id="root"></div>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (compat builds work with plain <script> tags, no bundler needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    <!-- Data & Utils -->
    <script src="AppData/appDataHandler.js"></script>
    <script src="AppLogic/exportTool.js"></script>

    <!-- Core Logic & Components -->
    <script type="text/babel" src="AppLogic/validation.js"></script>
    <script type="text/babel" src="AppLogic/sharedComponents.js"></script>
    <script type="text/babel" src="AppLogic/prompt.js"></script>
    <script type="text/babel" src="AppLogic/inventoryTable.js"></script>
    <script type="text/babel" src="AppLogic/supplierTable.js"></script>
    <script type="text/babel" src="AppLogic/itemList.js"></script>
    <script type="text/babel" src="AppLogic/userSettings.js"></script>

    <!-- Dashboard Widgets -->
    <script type="text/babel" src="DashboardLogic/totalItems.js"></script>
    <script type="text/babel" src="DashboardLogic/lowStock.js"></script>
    <script type="text/babel" src="DashboardLogic/suppliersOnly.js"></script>
    <script type="text/babel" src="DashboardLogic/recentArrivals.js"></script>
    <script type="text/babel" src="DashboardLogic/recentShipments.js"></script>
    <script type="text/babel" src="DashboardLogic/criticalReplenishment.js"></script>
    <script type="text/babel" src="DashboardLogic/categoryPerformance.js"></script>
    <script type="text/babel" src="DashboardLogic/warehouseDistribution.js"></script>
    <script type="text/babel" src="AppLogic/dashboard.js"></script>

    <!-- Main Entry -->
    <script type="text/babel" src="AppLogic/app.js"></script>
</body>

</html>
