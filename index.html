    <script>
        // High-Priority Password Reset Redirect
        (function() {
            const params = new URLSearchParams(window.location.search || window.location.hash.split('?')[1]);
            const isReset = params.get('mode') === 'resetPassword' || params.get('token') || params.get('oobCode');
            if (isReset) {
                const query = window.location.search || (window.location.hash.includes('?') ? '?' + window.location.hash.split('?')[1] : '');
                window.location.href = 'login.html' + query;
            }
        })();

        // Pre-render theme check to prevent light-flash
        try {
            const saved = localStorage.getItem('cloudbased_session');
            const session = saved ? JSON.parse(saved) : null;
            const theme = session?.settings?.theme || 'light';
            const accent = session?.settings?.themeColor;
            
            document.documentElement.setAttribute('data-theme', theme);
            if (accent) document.documentElement.style.setProperty('--accent-color', accent);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>
