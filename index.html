<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="Resources/index.css">

    <script>
        // Pre-render theme check to prevent light-flash
        try {
            const saved = localStorage.getItem('cloudbased_session');
            const session = saved ? JSON.parse(saved) : null;
            const theme = session?.settings?.theme || 'light';
            const accent = session?.settings?.themeColor;
            
            document.documentElement.setAttribute('data-theme', theme);
            if (accent) document.documentElement.style.setProperty('--accent-color', accent);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>

<body>
    <div id="root"></div>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (compat builds work with plain <script> tags, no bundler needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    <!-- Machine Learning & NLP Frameworks -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/compromise@latest/builds/compromise.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- Data & Utils -->
    <script src="AppData/appDataHandler.js"></script>
    <script src="AppLogic/exportTool.js"></script>

    <!-- Core Logic & Components -->

    <!-- Dashboard Widgets -->

    <script type="text/babel" src="DashboardLogic/suppliersOnly.js"></script>

    <script type="text/babel" src="DashboardLogic/recentShipments.js"></script>
