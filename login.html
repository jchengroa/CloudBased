<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System - Login</title>
    <link rel="stylesheet" href="assets/css/index.css">

    <script>
        // High-Security: Clear everything when hitting the login page
        localStorage.clear();
        document.documentElement.setAttribute('data-theme', 'light');
    </script>
</head>

<body>
    <div id="root"></div>

    <!-- React & Babel -->
    <script src="vendor/react.development.js" crossorigin></script>
    <script src="vendor/react-dom.development.js" crossorigin></script>
    <script src="vendor/babel.min.js"></script>


    <!-- Core Logic & Components -->
    <script src="src/data-management/modules/coreDataHandler.js"></script>
    <script src="src/data-management/modules/adminDataManager.js"></script>
    <script src="src/data-management/modules/authDataManager.js"></script>
    <script src="src/data-management/modules/inventoryDataManager.js"></script>
    <script src="src/data-management/modules/settingsDataManager.js"></script>
    <script type="text/babel" src="src/utils/validation.js"></script>
    <script type="text/babel" src="src/components/shared/icons.js"></script>
    <script type="text/babel" src="src/components/shared/tables.js"></script>
    <script type="text/babel" src="src/components/shared/layout.js"></script>
    <script type="text/babel" src="src/components/shared/forms.js"></script>
    <script type="text/babel" src="src/components/shared/utils.js"></script>
    <script type="text/babel" src="src/components/auth/authView.js"></script>
    
    <!-- Entry Point for Login -->
    <script type="text/babel">
        /** @jsx React.createElement */
        const LoginApp = () => {
            return (
                <div className="app-wrapper" style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Auth onLoginSuccess={(user) => {
                        window.location.href = 'index.html';
                    }} />
                </div>
            );
        };
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<LoginApp />);
        }
    </script>
</body>

</html>
