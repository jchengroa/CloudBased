<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBased</title>
    <link rel="icon" type="image/png" href="Resources/icon.png">
    <link rel="stylesheet" href="Resources/index.css">

    <script>
        // Apply the saved theme before React renders to avoid a flash.
        // Reads from localStorage synchronously; defaults to 'light' (matching defaultsettings.json).
        try {
            const saved = localStorage.getItem('cloudbased_tmp_settings');
            const theme = saved ? (JSON.parse(saved).theme || 'light') : 'light';
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>

<body>
    <div id="root"></div>

    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Components -->
    <script type="text/babel" src="AppLogic/Prompt.js"></script>
    <script type="text/babel" src="AppLogic/InventoryTable.js"></script>
    <script type="text/babel" src="AppLogic/SupplierTable.js"></script>
    <script type="text/babel" src="AppLogic/UserSettings.js"></script>

    <!-- Firebase SDK (compat builds work with plain <script> tags, no bundler needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <!-- Backend Controller -->
    <script src="AppData/AppDataHandler.js"></script>

    <!-- Global App Logic -->
    <script type="text/babel" src="AppLogic/app.js"></script>
</body>

</html>
