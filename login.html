<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBased - Login</title>
    <link rel="icon" type="image/png" href="Resources/icon.png">
    <link rel="stylesheet" href="Resources/index.css">

    <script>
        // Check if user is already logged in, redirect to app instantly
        try {
            const saved = localStorage.getItem('cloudbased_session');
            if (saved) {
                window.location.href = 'index.html';
            }
            const theme = saved ? (JSON.parse(saved).settings?.theme || 'light') : 'light';
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>

<body>
    <div id="root"></div>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    <!-- Core Logic & Components -->
    <script src="AppData/appDataHandler.js"></script>
    <script type="text/babel" src="AppLogic/validation.js"></script>
    <script type="text/babel" src="AppLogic/sharedComponents.js"></script>
    <script type="text/babel" src="AppLogic/auth.js"></script>
    
    <!-- Entry Point for Login -->
    <script type="text/babel">
        /** @jsx React.createElement */
        const LoginApp = () => {
            return (
                <div className="app-wrapper" style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Auth onLoginSuccess={(user) => {
                        window.location.href = 'index.html';
                    }} />
                </div>
            );
        };
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<LoginApp />);
        }
    </script>
</body>

</html>
